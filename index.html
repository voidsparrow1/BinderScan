<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sleevescope</title>
<meta name="theme-color" content="#15131C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Sora:wght@600;650;700&display=swap">
<style>
/* Mana (dark): a game-client night mode. Plum charcoal ground, one soft violet accent; the five mana colours appear only
   where they carry meaning (logo, loading, match status). Card art supplies the rest of the colour.
   Layout: sticky header, one scrolling column (max 720px), floating bottom tab bar. */
:root{
  --bg:#15131C; --surface:#201D2A; --surface-2:#2A2636; --surface-3:#332E41; --line:#3A3448; --fg:#F1EEF7; --muted:#A39DB3;
  --accent:#A78BFA; --accent-fg:#17131F; --accent-soft:rgba(167,139,250,.16);
  --w:#F4E9C8; --u:#5AA9E6; --b:#8C7F94; --r:#E8684A; --g:#4FB477;
  --ok:#4FB477; --warn:#E9B44C; --bad:#E8684A;
  --r-common:#A39DB3; --r-uncommon:#A9C4D6; --r-rare:#E6C36A; --r-mythic:#F08A4B;
  --f-head:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:18px; --radius-s:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-ui);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
header{position:sticky;top:0;z-index:5;background:rgba(21,19,28,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px}
header h1{margin:0;font:700 20px/1 var(--f-head);letter-spacing:-.015em}
header .sub{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;padding:8px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px;max-width:720px;margin:0 auto}
/* floating tab bar */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:24px;
  background:rgba(32,29,42,.84);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
nav.tabs button{background:none;border:0;border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs svg{width:22px;height:22px}
/* type */
h2{margin:0;font:650 21px/1.25 var(--f-head);letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--muted)}
.label{font-size:13px;font-weight:500;color:var(--muted)}
.panel>.label{font:600 16px/1.3 var(--f-head);color:var(--fg)}
/* surfaces & controls */
.panel{background:var(--surface);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--surface-2);border-radius:14px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
a.btn{text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
a.btn.primary{color:var(--accent-fg)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{min-height:38px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.wide{flex:1}
.btn svg{width:20px;height:20px}
input[type=text],input[type=search],input[type=password],input[type=number],select{width:100%;min-height:48px;border:1px solid transparent;background:var(--surface-2);border-radius:var(--radius-s);padding:10px 14px;outline:none}
textarea{width:100%;border:1px solid transparent;background:var(--surface-2);border-radius:var(--radius-s);padding:12px 14px;outline:none;resize:vertical;font:14px/1.5 var(--f-ui);color:var(--fg)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:1px 0 0;flex:none}
input[type=range]{accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field small{color:var(--muted);font-size:13px}
/* loading: the five mana colours */
.mana-dots{display:inline-flex;gap:6px;align-items:center}
.mana-dots i{width:9px;height:9px;border-radius:50%;animation:mana 1.1s ease-in-out infinite}
.mana-dots i:nth-child(1){background:var(--w)}.mana-dots i:nth-child(2){background:var(--u);animation-delay:.11s}.mana-dots i:nth-child(3){background:var(--b);animation-delay:.22s}
.mana-dots i:nth-child(4){background:var(--r);animation-delay:.33s}.mana-dots i:nth-child(5){background:var(--g);animation-delay:.44s}
@keyframes mana{0%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress b{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s}
.editor{position:relative;touch-action:none;border-radius:16px;overflow:hidden;background:#000;user-select:none}
.editor canvas{display:block;width:100%;height:auto}
/* review list */
.review{display:flex;flex-direction:column;gap:10px}
.rv{display:grid;grid-template-columns:76px 1fr;gap:14px;background:var(--surface);border-radius:var(--radius);padding:12px}
.rv.off{opacity:.5}
.rv .thumbs{display:flex;flex-direction:column;gap:6px}
.rv .thumbs img{width:76px;aspect-ratio:63/88;object-fit:cover;border-radius:5px;background:var(--surface-2)}
.rv .thumbs .crop{height:22px;aspect-ratio:auto;object-position:top;border-radius:4px;opacity:.8}
.rv .body{min-width:0;display:flex;flex-direction:column;gap:8px}
.rv .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rv .name{font:600 16px/1.25 var(--f-head);overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-variant-numeric:tabular-nums}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--surface-2);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.chip:disabled{opacity:.4}
.chip[aria-pressed="true"].foil{background:linear-gradient(120deg,#A78BFA,#5AA9E6 60%,#4FB477);color:var(--accent-fg)}
.chip.warn{color:var(--warn);box-shadow:inset 0 0 0 1.5px currentColor;background:transparent}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px 3px 8px;background:var(--surface-2)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.matched{color:var(--ok)}.status.guess,.status.weak{color:var(--warn)}.status.none{color:var(--bad)}.status.pending{color:var(--muted)}
.rar{font-weight:600}
.rar-common{color:var(--r-common)}.rar-uncommon{color:var(--r-uncommon)}.rar-rare{color:var(--r-rare)}.rar-mythic{color:var(--r-mythic)}
.qty{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:999px;overflow:hidden}
.qty button{border:0;background:none;width:34px;height:34px;font-weight:700;font-size:16px}
.qty span{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.sticky-actions{position:sticky;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:2;background:linear-gradient(transparent,var(--bg) 30%);padding:22px 0 6px;display:flex;gap:10px}
/* collection */
.hero{display:flex;flex-direction:column;gap:2px;padding:6px 2px 2px}
.hero .value{font:700 38px/1.1 var(--f-head);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .sub{color:var(--muted);font-size:14px}
.filters{display:grid;grid-template-columns:1fr auto;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.ci{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:0;border-radius:16px;padding:8px 14px 8px 8px;text-align:left;color:inherit}
.ci img{width:52px;aspect-ratio:63/88;object-fit:cover;border-radius:4px;background:var(--surface-2)}
.ci .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.ci .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.foil-dot{color:var(--accent);font-weight:800}
.empty{text-align:center;padding:40px 16px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:64px;height:64px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface-2);border-radius:var(--radius-s);padding:10px 12px;min-width:0}
.stats span{font-size:12.5px;color:var(--muted)}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(8,6,12,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:88vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet-head{padding:10px 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-body{overflow-y:auto;padding:4px 16px 22px;display:flex;flex-direction:column;gap:8px}
.sheet input[type=search],.sheet input[type=number],.sheet input[type=text]{background:var(--surface-2)}
.pr{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface-2);border:0;border-radius:14px;padding:8px 12px 8px 8px;color:inherit}
.pr[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.pr img{width:50px;aspect-ratio:63/88;object-fit:cover;border-radius:4px}
.pr .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-3);color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.4);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.detail-img{width:100%;max-width:280px;border-radius:14px;align-self:center}
.pockets{display:grid;gap:3px}
.pockets i{display:block;width:12px;height:16px;border-radius:2px;background:var(--surface-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.mana-dots i{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.6" r="3.3" fill="#F4E9C8"/><circle cx="19.1" cy="9.7" r="3.3" fill="#5AA9E6"/><circle cx="16.4" cy="18" r="3.3" fill="#8C7F94"/><circle cx="7.6" cy="18" r="3.3" fill="#E8684A"/><circle cx="4.9" cy="9.7" r="3.3" fill="#4FB477"/></svg><h1>Sleevescope</h1></div>
    <span class="sub" id="hdr-sub"></span>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6l1.5-2h5L16 6"/><circle cx="12" cy="13" r="3.5"/></svg>Scan</button>
    <button data-tab="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="5" height="7" rx="1"/><rect x="9.5" y="3" width="5" height="7" rx="1"/><rect x="16" y="3" width="5" height="7" rx="1"/><rect x="3" y="14" width="5" height="7" rx="1"/><rect x="9.5" y="14" width="5" height="7" rx="1"/><rect x="16" y="14" width="5" height="7" rx="1"/></svg>Collection</button>
    <button data-tab="wants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/><path d="M9.5 9.5h5M12 7v5"/></svg>Wants</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>
</div>
<input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="file-pick" accept="image/*" hidden>
<input type="file" id="file-import" accept="application/json,.json" hidden>

<script>
"use strict";
/* ===================== constants & storage ===================== */
const COUNTRIES = [
  ["Germany",7],["Austria",1],["Belgium",2],["Switzerland",4],["Spain",10],["France",12],
  ["United Kingdom",13],["Italy",17],["Netherlands",23],["Poland",25],["Portugal",26],["Sweden",28]
];
const APP_VERSION = "v18";
const SK = "binderscan.v1", SK_SET = "binderscan.settings.v1", SK_WANTS = "sleevescope.wants.v1"; // old names kept on purpose: renaming would lose saved data
const DEFAULT_SETTINGS = {country:"Germany",countryId:7,engine:"image",apiKey:"",model:"claude-sonnet-5-5",binder:"Binder 1"};
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Couldn't save: storage full or blocked")}}
const S = {
  tab:"scan",
  settings:Object.assign({},DEFAULT_SETTINGS,load(SK_SET,{})),
  coll:load(SK,[]),
  wants:load(SK_WANTS,[]), wantList:"",
  scan:null,       // {img canvas, pyr, cards:[{quad,sure,d,on}], detecting, adding}
  review:null,     // [{...}]
  scanning:false,
  progress:0,
  q:"",sort:"value"
};
const saveColl=()=>save(SK,S.coll), saveSet=()=>save(SK_SET,S.settings), saveWants=()=>save(SK_WANTS,S.wants);
if(S.settings.engine!=="claude")S.settings.engine="image";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap=s=>String(s||"").charAt(0).toUpperCase()+String(s||"").slice(1);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const eur=n=>n==null||isNaN(n)?"—":new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n);
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ===================== Scryfall ===================== */
let lastCall=0;
async function sf(path,opts={}){
  const wait=Math.max(0,lastCall+110-Date.now()); if(wait) await new Promise(r=>setTimeout(r,wait));
  lastCall=Date.now();
  const url=path.startsWith("http")?path:"https://api.scryfall.com"+path;
  const res=await fetch(url,{headers:{"Accept":"application/json",...(opts.body?{"Content-Type":"application/json"}:{})},method:opts.body?"POST":"GET",body:opts.body?JSON.stringify(opts.body):undefined});
  if(res.status===404) return null;
  if(!res.ok) throw new Error("Scryfall "+res.status);
  return res.json();
}
function slim(c){
  const face=c.card_faces?.[0];
  return {sid:c.id,name:c.name,printed:c.printed_name||face?.printed_name||null,set:c.set,setName:c.set_name,num:c.collector_number,
    rarity:c.rarity,lang:c.lang,released:c.released_at,
    img:c.image_uris?.small||face?.image_uris?.small||"",imgL:c.image_uris?.normal||face?.image_uris?.normal||"",
    eur:c.prices?.eur!=null?+c.prices.eur:null,eurFoil:c.prices?.eur_foil!=null?+c.prices.eur_foil:null,
    finishes:c.finishes||["nonfoil"],cmUrl:c.purchase_uris?.cardmarket||"",cmId:c.cardmarket_id||null,
    oracle:c.oracle_id,priced:Date.now()};
}
async function byName(name){
  name=name.trim(); if(name.length<3) return null;
  let c=await sf("/cards/named?fuzzy="+encodeURIComponent(name));
  if(c) return c;
  const ac=await sf("/cards/autocomplete?q="+encodeURIComponent(name.slice(0,Math.max(4,Math.floor(name.length*.6)))));
  if(ac?.data?.length) return sf("/cards/named?exact="+encodeURIComponent(ac.data[0]));
  return null;
}
async function bySetNum(set,num,lang){
  set=set.toLowerCase(); num=String(num).replace(/^0+(?=\d)/,"");
  let c=lang&&lang!=="en"?await sf(`/cards/${set}/${num}/${lang}`):null;
  return c||sf(`/cards/${set}/${num}`);
}
async function prints(card){
  return (await printsRaw(card.oracle)).map(slim);
}
function priceOf(e,foil=e.foil){ if(e.override!=null) return e.override; return foil?e.eurFoil:e.eur }
// Cardmarket links. Cardmarket's firewall blocked Scryfall's tracking link (referrer=scryfall…) when it was opened
// from this app, so the card button uses the plain product redirect, and links send no referrer.
const cmIdOf=e=>e.cmId||(String(e.cmUrl||"").match(/idProduct=(\d+)/)||[])[1]||null;
const CM_LINKS={
  card:e=>cmIdOf(e)?`https://www.cardmarket.com/en/Magic/Products?idProduct=${cmIdOf(e)}`:null,
  search:e=>`https://www.cardmarket.com/en/Magic/Products/Search?searchString=${encodeURIComponent(e.name)}`,
  scryfall:e=>e.cmUrl||null,
  home:()=>"https://www.cardmarket.com/en/Magic"
};
function cmLink(e){const order=[S.settings.cmLink||"card","card","search"];for(const k of order){const u=CM_LINKS[k]?.(e);if(u)return u}return CM_LINKS.home()}

/* ===================== image helpers ===================== */
function fileToCanvas(file){
  return new Promise((ok,bad)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{const max=2600,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
      const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c)};
    img.onerror=()=>{URL.revokeObjectURL(url);bad(new Error("That file isn't an image this browser can open."))};
    img.src=url;
  });
}

async function detectCards(photo,onStep){
  const sc0=DET_LONG/Math.max(photo.width,photo.height),W=Math.round(photo.width*sc0),H=Math.round(photo.height*sc0);
  let e=rgbEdges(photo,W,H);const ang=dominantAngle(e.GX,e.GY);
  if(Math.abs(ang)>.6){const r=document.createElement("canvas");r.width=photo.width;r.height=photo.height;const x=r.getContext("2d");
    x.fillStyle="#000";x.fillRect(0,0,r.width,r.height);x.translate(r.width/2,r.height/2);x.rotate(-ang*Math.PI/180);x.drawImage(photo,-photo.width/2,-photo.height/2);e=rgbEdges(r,W,H)}
  onStep?.("Looking for cards…");await new Promise(r=>setTimeout(r,0));
  const rects=rectCandidates(e.GX,e.GY,W,H);
  // straightened working coords <-> original photo coords
  const a=ang*Math.PI/180,cx=photo.width/2,cy=photo.height/2,co=Math.cos(a),si=Math.sin(a);
  const toPhoto=([x,y])=>{x=x/sc0-cx;y=y/sc0-cy;return[cx+x*co-y*si,cy+x*si+y*co]};
  const toWork=([x,y])=>{x-=cx;y-=cy;return[(cx+x*co+y*si)*sc0,(cy-x*si+y*co)*sc0]};

  for(const r of rects){r.quad=r.quad0=quadOf(r);r.d=999}
  if(!IDX) return order(rects.filter((r,i)=>i<12&&r.sc>rects[0].sc*.8).map(r=>({...r,sure:false})));
  const pyr=makePyramid(photo);
  onStep?.("Checking which outlines are cards…");

  {const ref=keep.length?median(keep.map(k=>k.sc)):rects[0]?.sc||0,mw0=keep.length?median(keep.map(k=>k.w)):0;let tries=0;
   for(const r of [...rects].sort((p,q)=>q.sc-p.sc)){if(tries>=4||r.sc<ref*.6)break;if(r.d<=TH.acc||!keep.every(k=>ovlR(k,r)<.35))continue;
     if(mw0&&Math.abs(r.w/mw0-1)>.3)continue;tries++;await new Promise(z=>setTimeout(z,0));
     const f=fpRefine(pyr,r.quad0),fr=rectOf(f.quad);if(f.d<=TH.grid&&keep.every(k=>ovlR(k,fr)<.35))keep.push({...fr,sc:r.sc,quad:f.quad,d:f.d,sure:true})}}
  // binder pages: cards sit on a regular grid, so check every grid spot the confirmed cards imply
  if(keep.length>=2){
    onStep?.("Checking the rest of the page…");
    const mw=median(keep.map(k=>k.w)),mh=median(keep.map(k=>k.h));
    const axis=(vals,size,lim)=>{const c=[];for(const v of[...vals].sort((p,q)=>p-q)){const last=c[c.length-1];if(last&&v-last.v/last.n<size*.5){last.v+=v;last.n++}else c.push({v,n:1})}
      let pos=c.map(k=>k.v/k.n);const gaps=[];for(let i=1;i<pos.length;i++)gaps.push(pos[i]-pos[i-1]);
      const step=gaps.filter(g=>g<size*1.6).length?median(gaps.filter(g=>g<size*1.6)):size*1.08,out=[];

      const r={x:gx.v-mw/2,y:gy.v-mh/2,w:mw,h:mh};if(!keep.every(k=>ovlR(k,r)<.35))continue;

/* ===================== scan flow ===================== */
function cropCard(pyr,quad,w){let L=pyr[0];for(const l of pyr)if(qW(quad)*l.s>=w)L=l;return warpQuad(L.data,L.w,L.h,quad.map(([x,y])=>[x*L.s,y*L.s]),w,Math.round(w*88/63))}
async function onPhoto(file){
  if(!file) return;
  let img;try{img=await fileToCanvas(file)}catch(e){toast(e.message);return}
  S.review=null;await findCards(img);
}
async function findCards(img){
  S.scan={img,cards:null,detecting:true,step:"Loading card database…",adding:false};render();
  try{
    await loadIndex();
    S.scan.pyr=makePyramid(img);
    const cards=await detectCards(img,msg=>{S.scan.step=msg;const el=$("#ol-step");if(el)el.textContent=msg});
    S.scan.cards=cards.map(c=>({...c,on:true}));
  }catch(e){S.scan.cards=[];toast("Couldn't look for cards: "+e.message)}
  S.scan.detecting=false;
  if(!S.scan.cards.length){S.scan.adding=true;toast("No cards found. Tap Add a card, then tap each card in the photo.")}
  render();
}
// tapped spot in add mode: start with an outline the size of the others, then let the fingerprint snap it onto the card
async function addCardAt(x,y){
  const sc=S.scan,others=sc.cards.map(c=>c.quad);
  const w=others.length?median(others.map(qW)):sc.img.width*.3,h=w*88/63;
  const card={quad:[[x-w/2,y-h/2],[x+w/2,y-h/2],[x+w/2,y+h/2],[x-w/2,y+h/2]],sure:false,d:1e6,on:true,manual:true};
  sc.cards.push(card);sc.adding=false;render();
  if(IDX&&sc.pyr){const f=fpRefine(sc.pyr,card.quad);if(f.d<=TH.grid){card.quad=f.quad;card.d=f.d;card.sure=true;render()}}
}
async function runScan(){
  const sc=S.scan,sel=(sc?.cards||[]).filter(c=>c.on);if(!sel.length) return;
  S.scanning=true;S.progress=0;
  const pyr=sc.pyr||makePyramid(sc.img);
  S.review=sel.map((c,i)=>{const cv=cropCard(pyr,c.quad,520);return{key:uid(),n:i+1,thumb:thumb(cv),big:thumb(cv,520),status:"pending",ocr:"",card:null,foil:false,qty:1,include:true}});
  render();
  try{
    if(S.settings.engine==="claude"&&S.settings.apiKey){
      setProgress(.15,"Asking Claude to read the cards…");
      const cells=sel.map(c=>({cv:cropCard(pyr,c.quad,600)}));
      const res=await identifyClaude(cells);
      for(let i=0;i<sel.length;i++){const it=S.review[i],r=await resolveClaude(res.find(k=>+k.index===i+1));
        Object.assign(it,{status:r.status,card:r.card,ocr:r.ocr});if(r.foil&&it.card?.finishes.includes("foil"))it.foil=true;if(!it.card)it.include=false;
        setProgress((i+1)/sel.length);renderReview()}
    } else await matchOutlines(sel,pyr);
  }catch(e){toast(e.message)}
  S.scanning=false;render();
}
async function matchOutlines(sel,pyr){
  if(!IDX&&!await loadIndex()){toast("The card database isn't available. Check your connection and try again.");S.review.forEach(it=>{it.status="none";it.ocr="No database"});return}
  const tops=[];
  for(let i=0;i<sel.length;i++){
    setProgress(.05+.45*i/sel.length,`Comparing card ${i+1} of ${sel.length}…`);await new Promise(r=>setTimeout(r,0));
    let top=searchIndex(V_FINE.map(v=>hashQuad(pyr,variantQuad(sel[i].quad,...v))),TOPK);
    // unsure result: take a closer look around the outline (it may be slightly off the card) and search again
    if(!top.length||top[0].d>TH.weak){const f=fpRefine(pyr,sel[i].quad);if(f.d<top[0]?.d){sel[i].quad=f.quad;top=searchIndex(V_FINE.map(v=>hashQuad(pyr,variantQuad(f.quad,...v))),TOPK)}}
    tops.push(top);
  }
  setProgress(.55,"Fetching card details…");
  const ids=[...new Set(tops.flat().map(t=>t.id))],raw=new Map();
  try{for(let i=0;i<ids.length;i+=75){const r=await sf("/cards/collection",{body:{identifiers:ids.slice(i,i+75).map(id=>({id}))}});for(const c of r?.data||[])raw.set(c.id,c)}}
  catch(e){toast("Couldn't reach Scryfall: "+e.message);S.review.forEach(it=>{it.status="none";it.ocr="Scryfall unreachable"});return}
  for(let i=0;i<sel.length;i++){
    const it=S.review[i],res=rerank(tops[i],raw);
    it.status=res.status;it.card=res.card;it.ocr=res.ocr;
    if(!it.card||res.status==="weak") it.include=false;
    if(it.card&&!it.card.finishes.includes("nonfoil")) it.foil=true;
  }
  setProgress(1);renderReview();
}
// add a card by hand (no photo): it joins the review list, where foil, version and quantity are set as usual
function addByHand(){
  manualSearch("",(p,exact)=>{
    if(!S.review) S.review=[];
    S.review.push({key:uid(),n:S.review.length+1,thumb:null,big:null,status:exact?"matched":"guess",ocr:exact?"Added by set + number":"Added by name",
      card:p,foil:!p.finishes.includes("nonfoil"),qty:1,include:true,manual:true});
    S.tab="scan";render();if(!exact)toast("Added. Tap Version if you have a different printing.");
    requestAnimationFrame(()=>document.querySelector(".rv:last-child")?.scrollIntoView({behavior:"smooth",block:"center"}));
  },null,"Add a card");
}
function setProgress(p,msg){S.progress=p;const b=$("#prog b");if(b)b.style.width=Math.round(p*100)+"%";if(msg&&$("#prog-msg"))$("#prog-msg").textContent=msg}
function commitReview(){
  const items=S.review.filter(x=>x.include&&x.card); if(!items.length){toast("No cards selected to add");return}
  const binder=S.settings.binder.trim()||"Unsorted"; let added=0;
  for(const it of items){
    const ex=S.coll.find(e=>e.sid===it.card.sid&&e.foil===it.foil&&e.binder===binder);
    if(ex) ex.qty+=it.qty; else S.coll.push({...it.card,id:uid(),foil:it.foil,qty:it.qty,binder,override:null,added:Date.now()});
    added+=it.qty;
  }
  saveColl();S.review=null;S.scan=null;toast(`Added ${added} card${added>1?"s":""} to ${binder}`);S.tab="collection";render();
}

/* ===================== sheets: version picker & manual search ===================== */
function sheet(title,bodyHtml,onMount){
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="btn small ghost" data-close>Close</button></div><div class="sheet-body">${bodyHtml}</div></div>`;
  const close=()=>bg.remove();
  bg.addEventListener("click",e=>{if(e.target===bg||e.target.closest("[data-close]"))close()});
  document.body.appendChild(bg);onMount?.($(".sheet-body",bg),close);return close;
}
function printRow(p,cur,foil){
  const pr=foil?p.eurFoil:p.eur;
  return `<button class="pr" data-sid="${p.sid}" aria-current="${p.sid===cur}"><img src="${esc(p.img)}" alt="" loading="lazy"><span class="body"><span style="font-weight:600">${esc(p.setName)}</span><span class="meta"><span>${esc(p.set.toUpperCase())} ${esc(p.num)}</span><span class="rar rar-${p.rarity}">${esc(cap(p.rarity))}</span><span>${esc((p.released||"").slice(0,4))}</span></span><span class="meta">${p.finishes.map(f=>f==="nonfoil"?"normal":f).join(", ")}</span></span><span class="price">${eur(pr)}</span></button>`;
}
function pickVersion(target,onPick){
  sheet("Choose version",`<p class="muted">Loading printings of ${esc(target.name)}…</p>`,async(body,close)=>{
    try{const list=await prints(target);
      body.innerHTML=`<p class="hint">${list.length} printings. Prices are Cardmarket ${target.foil?"foil":"non-foil"} trend.</p>`+list.map(p=>printRow(p,target.sid,target.foil)).join("");
      body.onclick=e=>{const b=e.target.closest(".pr");if(!b)return;onPick(list.find(p=>p.sid===b.dataset.sid));close()};
    }catch(e){body.innerHTML=`<p>Couldn't load printings: ${esc(e.message)}</p>`}
  });
}
const SETNUM=/^([a-z0-9]{3,5})\s*[#\-\/ ]\s*0*(\d{1,4}[a-z★]?)$/i;
function manualSearch(initial,onPick,photo,title="Find card"){
  sheet(title,`${photo?`<img src="${photo}" alt="Your photo of this pocket" style="width:100%;max-width:320px;align-self:center;border-radius:8px">`:""}
    <input type="search" id="ms-q" placeholder="Name, or set + number like FIN 519" value="${esc(initial||"")}" autocomplete="off" autocapitalize="off">
    <p class="hint">Fastest: type the set code and number from the card's bottom-left corner, e.g. <span class="mono">fin 519</span>. That gives the exact version.</p>
    <div id="ms-res" class="list"></div>`,(body,close)=>{
    const q=$("#ms-q",body),out=$("#ms-res",body);let t,seq=0;
    const go=async()=>{const v=q.value.trim(),my=++seq;if(v.length<2){out.innerHTML="";return}
      try{
        const m=v.match(SETNUM);
        if(m){const c=await bySetNum(m[1],m[2]);if(my!==seq)return;
          if(c){const p=slim(c);out.innerHTML=printRow(p,"",false);out.onclick=e=>{if(e.target.closest(".pr")){onPick(p,true);close()}};return}}
        const r=await sf("/cards/autocomplete?q="+encodeURIComponent(v));if(my!==seq)return;
        out.onclick=async e=>{const b=e.target.closest("[data-n]");if(!b)return;let c=await sf("/cards/named?exact="+encodeURIComponent(b.dataset.n));
          // by name: start from the newest regular printing rather than whatever promo Scryfall lists first
          if(c){try{const reg=(await printsRaw(c.oracle_id)).find(x=>!isPromo(x)&&!x.digital);if(reg)c=reg}catch{}
            onPick(slim(c),false);close()}};
        out.innerHTML=(r?.data||[]).slice(0,12).map(n=>`<button class="btn" style="justify-content:flex-start" data-n="${esc(n)}">${esc(n)}</button>`).join("")||`<p class="muted">Nothing matches "${esc(v)}". For set + number, use the format FIN 519.</p>`;
      }catch(e){out.innerHTML=`<p>${esc(e.message)}</p>`}};
    q.oninput=()=>{clearTimeout(t);t=setTimeout(go,300)};go();setTimeout(()=>q.focus(),50);
  });
}
/* ===================== render ===================== */
const pocketsIcon=(r,c)=>`<span class="pockets" style="grid-template-columns:repeat(${c},9px)">${"<i></i>".repeat(r*c)}</span>`;
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  $("#hdr-sub").textContent=APP_VERSION;
  const m=$("#main");
  if(S.tab==="scan") m.innerHTML=viewScan();
  else if(S.tab==="collection") m.innerHTML=viewCollection();
  else if(S.tab==="wants") m.innerHTML=viewWants();
  else m.innerHTML=viewSettings();

    <div class="row"><a class="btn primary wide" href="${esc(w.any?CM_LINKS.search(w):cmLink(w))}" target="_blank" rel="noopener noreferrer">Open on Cardmarket</a><a class="btn ghost" href="${esc(CM_LINKS.search(w))}" target="_blank" rel="noopener noreferrer">Search by name</a></div>
    <div class="row"><button class="chip foil" id="w-foil" aria-pressed="${w.foil}" ${canFoil?"":"disabled"}>✦ Foil</button><button class="chip" id="w-any" aria-pressed="${!!w.any}" style="${w.any?"background:var(--accent-soft);color:var(--accent)":""}">Any version</button><button class="chip" id="w-ver">Version</button>
      <span class="qty"><button id="w-dec" aria-label="Fewer">−</button><span id="w-q">${w.qty}</span><button id="w-inc" aria-label="More">+</button></span></div>
    <div class="field"><label class="label" for="w-list">List</label><input type="text" id="w-list" value="${esc(w.list)}" list="w-lists"><datalist id="w-lists">${wantLists().map(l=>`<option value="${esc(l)}">`).join("")}</datalist></div>
    <div class="field"><label class="label" for="w-note">Note (optional)</label><input type="text" id="w-note" value="${esc(w.note||"")}" placeholder="e.g. trade with Max, max 5 €"></div>
    <button class="btn" id="w-got">Got it: move 1 to ${esc(S.settings.binder||"collection")}</button>
    <div class="row"><button class="btn primary wide" id="w-save">Save</button><button class="btn ghost" id="w-del" style="color:var(--bad)">Remove</button></div>`,
  (body,close)=>{
    let q=w.qty,foil=w.foil,any=!!w.any,ver=null;
    $("#w-inc",body).onclick=()=>{q++;$("#w-q",body).textContent=q};
    $("#w-dec",body).onclick=()=>{q=Math.max(1,q-1);$("#w-q",body).textContent=q};
    $("#w-foil",body).onclick=ev=>{foil=!foil;ev.currentTarget.setAttribute("aria-pressed",foil)};
    $("#w-any",body).onclick=ev=>{any=!any;ev.currentTarget.setAttribute("aria-pressed",any);ev.currentTarget.style.cssText=any?"background:var(--accent-soft);color:var(--accent)":""};
    $("#w-ver",body).onclick=()=>pickVersion({...w,foil},p=>{ver=p;any=false;toast(`Version set to ${p.setName}. Tap Save.`)});
    const apply=()=>{Object.assign(w,ver?{...ver,id:w.id,list:w.list,added:w.added,note:w.note}:{},{qty:q,foil,any,list:$("#w-list",body).value.trim()||"Wants",note:$("#w-note",body).value.trim()});
      if(ver&&!w.finishes.includes(foil?"foil":"nonfoil")) w.foil=!foil};
    $("#w-save",body).onclick=()=>{apply();saveWants();close();render();toast("Saved")};
    $("#w-got",body).onclick=()=>{apply();
      const binder=S.settings.binder.trim()||"Unsorted",card={...w};delete card.list;delete card.note;delete card.any;
      const ex=S.coll.find(e=>e.sid===w.sid&&e.foil===w.foil&&e.binder===binder);
      if(ex) ex.qty++; else S.coll.push({...card,id:uid(),qty:1,binder,override:null,added:Date.now()});
      if(w.qty>1) w.qty--; else S.wants=S.wants.filter(x=>x.id!==w.id);
      saveColl();saveWants();close();render();toast(`Moved to ${binder}`)};
    let armed=false;
    $("#w-del",body).onclick=ev=>{if(!armed){armed=true;ev.currentTarget.textContent="Tap again to remove";return}
      S.wants=S.wants.filter(x=>x.id!==w.id);saveWants();close();render();toast("Removed")};
  });
}

  </section>`;

/* ===================== outline editor ===================== */
// The photo with every found card outlined: tap an outline to leave it out / bring it back, drag a corner to fix it,
// or use "Add a card" and tap a card that was missed.
function mountOutlineEditor(){
  const cv=$("#ol-cv"),sc=S.scan,img=sc.img,ds=Math.min(1,1400/Math.max(img.width,img.height));
  cv.width=Math.round(img.width*ds);cv.height=Math.round(img.height*ds);
  const ctx=cv.getContext("2d"),W=cv.width,H=cv.height,big=Math.max(W,H),hr=big*.022,lw=Math.max(2,big/450);
  const P=([x,y])=>[x*ds,y*ds];
  let drag=null,down=null;
  const inside=(q,[x,y])=>{let c=false;for(let i=0,j=3;i<4;j=i++){const[xi,yi]=q[i],[xj,yj]=q[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c};
  function draw(){
    ctx.drawImage(img,0,0,W,H);
    if(sc.detecting){ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,W,H);return}
    (sc.cards||[]).forEach((c,i)=>{
      const q=c.quad.map(P);ctx.beginPath();q.forEach((p,j)=>j?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();
      if(!c.on){ctx.fillStyle="rgba(0,0,0,.55)";ctx.fill()}
      ctx.setLineDash(c.on&&c.sure?[]:[lw*4,lw*3]);ctx.lineWidth=lw*1.6;ctx.strokeStyle=!c.on?"rgba(241,238,247,.55)":c.sure?"#4FB477":"#E9B44C";ctx.stroke();ctx.setLineDash([]);
      // number badge
      const [bx,by]=q[0],r=hr*1.1;ctx.beginPath();ctx.arc(bx+r*1.2,by+r*1.2,r,0,7);ctx.fillStyle=!c.on?"#4a4458":c.sure?"#4FB477":"#E9B44C";ctx.fill();
      ctx.fillStyle="#17131F";ctx.font=`700 ${Math.round(r*1.2)}px system-ui,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(c.on?String(i+1):"✕",bx+r*1.2,by+r*1.25);
      if(c.on) q.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,hr*.55,0,7);ctx.fillStyle="rgba(255,255,255,.85)";ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle="#111";ctx.stroke()});
    });
    if(drag) loupe(P(sc.cards[drag.ci].quad[drag.k]));
  }
  // magnifier in the top corner away from your finger, so you can see the edge you're placing
  function loupe([px,py]){
    const r=big*.13,z=3,cx=px<W/2?W-r-lw*6:r+lw*6,cy=r+lw*6;
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();ctx.fillStyle="#000";ctx.fillRect(cx-r,cy-r,2*r,2*r);
    ctx.drawImage(img,(px-r/z)/ds,(py-r/z)/ds,2*r/z/ds,2*r/z/ds,cx-r,cy-r,2*r,2*r);
    const q=sc.cards[drag.ci].quad.map(P).map(([x,y])=>[cx+(x-px)*z,cy+(y-py)*z]);ctx.beginPath();q.forEach((p,j)=>j?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.strokeStyle="#4FB477";ctx.lineWidth=lw;ctx.stroke();
    ctx.strokeStyle="#fff";ctx.lineWidth=lw*.8;ctx.beginPath();ctx.moveTo(cx-r*.15,cy);ctx.lineTo(cx+r*.15,cy);ctx.moveTo(cx,cy-r*.15);ctx.lineTo(cx,cy+r*.15);ctx.stroke();
    ctx.restore();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.strokeStyle="#A78BFA";ctx.lineWidth=lw*2;ctx.stroke();
  }
  draw();
  if(sc.detecting) return;
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  cv.onpointerdown=e=>{const p=pos(e);down={p,moved:false};
    let best=null,bd=hr*2;(sc.cards||[]).forEach((c,ci)=>{if(!c.on)return;c.quad.forEach((q,k)=>{const d=Math.hypot(q[0]*ds-p[0],q[1]*ds-p[1]);if(d<bd){bd=d;best={ci,k}}})});
    if(best&&!sc.adding){drag=best;cv.setPointerCapture(e.pointerId);draw()}};
  cv.onpointermove=e=>{if(!down)return;const p=pos(e);if(Math.hypot(p[0]-down.p[0],p[1]-down.p[1])>hr*.4)down.moved=true;
    if(!drag)return;const c=sc.cards[drag.ci];c.quad[drag.k]=[Math.max(0,Math.min(img.width,p[0]/ds)),Math.max(0,Math.min(img.height,p[1]/ds))];c.sure=c.sure&&false;draw()};
  cv.onpointerup=e=>{const p=pos(e),wasDrag=drag;drag=null;
    if(down&&!down.moved&&!wasDrag){
      const pt=[p[0]/ds,p[1]/ds];
      if(sc.adding){down=null;return addCardAt(...pt)}
      const hit=(sc.cards||[]).map((c,i)=>({c,i})).filter(({c})=>inside(c.quad,pt)).sort((a,b)=>qW(a.c.quad)-qW(b.c.quad))[0];
      if(hit){hit.c.on=!hit.c.on;down=null;render();return}
    }
    down=null;draw();
    if(wasDrag) render();
  };
  cv.onpointercancel=()=>{drag=null;down=null;draw()};
}

/* ===================== events ===================== */
document.querySelector("nav.tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b){S.tab=b.dataset.tab;render()}};
$("#file-cam").onchange=e=>{onPhoto(e.target.files[0]);e.target.value=""};
$("#file-pick").onchange=e=>{onPhoto(e.target.files[0]);e.target.value=""};
$("#file-import").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());const items=Array.isArray(d)?d:d.cards;if(!Array.isArray(items))throw 0;
    const ids=new Set(S.coll.map(x=>x.id));let n=0;for(const it of items)if(it.sid&&!ids.has(it.id)){S.coll.push({...it,id:it.id||uid()});n++}
    let m=0;if(Array.isArray(d.wants)){const wids=new Set(S.wants.map(x=>x.id));for(const w of d.wants)if(w.sid&&!wids.has(w.id)){S.wants.push({...w,id:w.id||uid()});m++}saveWants()}
    saveColl();render();toast(`Imported ${n} cards${m?` and ${m} wants`:""}`)}catch{toast("That file isn't a Sleevescope backup.")}};
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function refreshPrices(btn){
  btn.disabled=true;btn.textContent="Refreshing…";
  try{const ids=[...new Set([...S.coll,...S.wants].map(e=>e.sid))];
    for(let i=0;i<ids.length;i+=75){const r=await sf("/cards/collection",{body:{identifiers:ids.slice(i,i+75).map(id=>({id}))}});
      for(const c of r?.data||[]){const s=slim(c);S.coll.filter(e=>e.sid===c.id).forEach(e=>Object.assign(e,{eur:s.eur,eurFoil:s.eurFoil,cmUrl:s.cmUrl,cmId:s.cmId,priced:s.priced}));
        S.wants.filter(e=>e.sid===c.id).forEach(e=>Object.assign(e,{eur:s.eur,eurFoil:s.eurFoil,cmUrl:s.cmUrl,cmId:s.cmId,priced:s.priced}))}}
    saveColl();saveWants();toast("Prices updated")}catch(e){toast("Couldn't refresh prices: "+e.message)}
  render();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-goto]"); if(!t) return;
  if(t.dataset.goto){S.tab=t.dataset.goto;render();return}
  if(t.id==="take") return $("#file-cam").click();
  if(t.id==="pick") return $("#file-pick").click();
  if(t.id==="ol-add"){S.scan.adding=!S.scan.adding;render();return}
  if(t.id==="ol-rot"){findCards(rotateCanvas(S.scan.img));return}
  if(t.id==="ol-retake"){S.scan=null;render();return}
  if(t.id==="ol-scan") return runScan();
  if(t.id==="rv-back"){S.review=null;render();return}
  if(t.id==="add-hand") return addByHand();
  if(t.id==="rv-add") return commitReview();
  if(t.id==="refresh") return refreshPrices(t);
  if(t.id==="exp-json") return download(`sleevescope-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:"Sleevescope",version:2,cards:S.coll,wants:S.wants},null,1),"application/json");
  if(t.id==="exp-csv"){const h=["Name","Set","Set code","Number","Language","Foil","Qty","Price EUR","Total EUR","Binder","Cardmarket ID"];
    const rows=S.coll.map(e=>[e.name,e.setName,e.set.toUpperCase(),e.num,e.lang,e.foil?"yes":"no",e.qty,priceOf(e)??"",priceOf(e)!=null?(priceOf(e)*e.qty).toFixed(2):"",e.binder,e.cmId??""]);
    return download("sleevescope.csv",[h,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n"),"text/csv")}
  if(t.id==="imp-json") return $("#file-import").click();
  if(t.id==="add-want") return addWant();
  if(t.id==="copy-wants") return copyWants();
  if(t.dataset.wlist!==undefined){S.wantList=t.dataset.wlist;render();return}
  const ci=t.closest(".ci"); if(ci&&ci.dataset.wid) return wantDetail(ci.dataset.wid); if(ci) return cardDetail(ci.dataset.id);
  const rv=t.closest(".rv"); if(rv&&t.dataset.act){
    const it=S.review[+rv.dataset.i];
    switch(t.dataset.act){
      case "foil": it.foil=!it.foil;break;
      case "inc": it.qty++;break;
      case "dec": it.qty=Math.max(1,it.qty-1);break;
      case "inc-toggle": it.include=!it.include;break;
      case "ver": return pickVersion({...it.card,foil:it.foil},p=>{it.card=p;it.status="matched";if(!p.finishes.includes(it.foil?"foil":"nonfoil"))it.foil=!it.foil;renderReview()});
      case "search": return manualSearch("",(p,exact)=>{it.card=p;it.status=exact?"matched":"guess";it.ocr=exact?"Picked by set + number":"Picked by name";it.include=true;it.foil=!p.finishes.includes("nonfoil");renderReview()},it.big);
    }
    renderReview();
  }
});
document.addEventListener("input",e=>{
  const id=e.target.id, s=S.settings;
  if(id==="binder"){s.binder=e.target.value;saveSet()}
  if(id==="want-list"){s.wantList=e.target.value;saveSet()}
  if(id==="cq"){S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#cq");n.focus();n.setSelectionRange(pos,pos)}
  if(id==="s-key"){s.apiKey=e.target.value.trim();saveSet()}
  if(id==="s-model"){s.model=e.target.value.trim()||DEFAULT_SETTINGS.model;saveSet()}
});
document.addEventListener("change",e=>{
  const id=e.target.id, s=S.settings;
  if(id==="csort"){S.sort=e.target.value;render()}
  if(id==="s-country"){s.country=e.target.value;s.countryId=COUNTRIES.find(c=>c[0]===s.country)[1];saveSet();render()}
  if(id==="s-cmlink"){s.cmLink=e.target.value;saveSet()}
  if(id==="s-engine"){s.engine=e.target.value;saveSet();if(s.engine==="claude"&&!s.apiKey)toast("Add your API key below to use Claude")}
});
const _render=render; render=function(){_render();const cs=$("#csort");if(cs)cs.value=S.sort};
if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
