name: Diagnostics - Cardmarket expansions

# Helper for debugging the Cardmarket version table: lists the largest recent expansions without a name.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      - run: python build_cm.py
        env:
          CM_DEBUG: "1"
